# AdventureWorks/pytest.ini
[pytest]
minversion = 7.0
testpaths = tests

# default flags; tweak as you like
addopts = -q -ra

markers =
    spark: tests that require a SparkSession
    unit: fast, pure-function tests
    slow: large or I/O-heavy tests

# quiet down noisy libs during tests
filterwarnings =
    ignore::DeprecationWarning:py4j.*
    ignore::FutureWarning:pyspark.*

log_cli = true
log_cli_level = WARNING
